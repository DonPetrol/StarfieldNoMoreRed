; No More Red - goes next to NoMoreRed.dll in Data\SFSE\Plugins\
; Keys are Windows virtual-key codes (0 = no hotkey). Every toggle shows a HUD message.
; Hotkeys only work in build mode.
; Default keys: Insert / Home / End / Delete / Page Up / Page Down toggle,
; Ctrl + mouse wheel moves the held item, Ctrl + left / right mouse button fine-rotates it.

[General]
; No More Red on at startup, and its hotkey (0x2D = Insert)
Enabled=1
ToggleKey=0x2D
ShowMessages=1
; Detailed troubleshooting log in NoMoreRed.log: placement code changes, every edit of a placed object,
; scaled moves, foundation sizing, collision rebuilds, hold distance changes
VerboseLog=0
; Key that must be held for the Distance and Fine rotate controls (0x11 = Ctrl, 0 = none).
; While it is held in build mode, those buttons / the wheel don't reach the game (no vanilla rotate
; or menu scrolling at the same time).
ModifierKey=0x11

[Snapping]
; Object snapping: the held item attaching to snap points on other pieces (0x24 = Home).
; While it is off, "must be snapped" pieces such as walls can still be placed.
ObjectSnapping=1
ObjectSnapToggleKey=0x24
; Surface snapping: for the game's Precise Placement mode (0x23 = End). Off = the held item
; no longer stops at any surface (ground, ships, outpost objects) and can go into or through it.
SurfaceSnapping=1
SurfaceSnapToggleKey=0x23

[Foundations]
; The foundation pieces built under structures (0x2E = Delete). Off = none are built.
Foundations=1
ToggleKey=0x2E

[WorkshopBoundary]
; Workshop boundary (0x21 = Page Up). 0 = off: build outside the build area, and leaving the area
; no longer exits build mode. 1 = vanilla boundary. Replaces OutsideBuildArea in [Relax].
WorkshopBoundary=0
ToggleKey=0x21

[Rotation]
; Rotate with view: the held item turns with you, like Fallout 4 (0x22 = Page Down).
; Off = vanilla, the item keeps its rotation in the world when you turn.
RotateWithView=0
ToggleKey=0x22
; Fine rotate: with ModifierKey held, turn the held item by FineRotateStep degrees per click,
; repeating while held (0x01 = left mouse button, 0x02 = right mouse button; keyboard keys work too).
; Snapped pieces keep the game's rotation.
FineRotateLeftKey=0x01
FineRotateRightKey=0x02
FineRotateStep=1.0

[Distance]
; With ModifierKey held, the mouse wheel moves the held item further (up) / closer (down) by Step
; per notch. FartherKey / CloserKey optionally add keys for it too (0 = none; hold to repeat).
MouseWheel=1
FartherKey=0
CloserKey=0
Step=0.25
Min=0.5
Max=50

[EditPlaced]
; Adjust the placed object you are looking at in build mode (while not holding anything).
; It moves exactly by the step: no camera follow, snapping or placement checks. Hold to repeat.
; Numpad keys need Num Lock on. Ctrl + wheel also pushes / pulls the object and Ctrl + left / right
; click rotates it (by FineRotateStep, about the rotate axis).
; Structures (and other grouped objects) move, turn and scale as a whole, about their centre.
; Move left / right / up / down relative to your view (0x64 / 0x66 / 0x68 / 0x62 = numpad 4 / 6 / 8 / 2)
LeftKey=0x64
RightKey=0x66
UpKey=0x68
DownKey=0x62
; Scale down / up (0x61 / 0x63 = numpad 1 / 3)
ScaleDownKey=0x61
ScaleUpKey=0x63
; Distance per press (also per Ctrl + wheel notch), scale change per press, scale limits
MoveStep=0.05
ScaleStep=0.05
ScaleMin=0.1
ScaleMax=10
; Step keys change the step sizes (and show them on screen) through 0.1% 0.5% 1% 5% 10% 25% 50% 100% 200%
; of 1.0 scale / 1 m / 90 degrees. They start from ScaleStep, MoveStep and [Rotation] FineRotateStep.
; Scale step down / up (0x67 / 0x69 = numpad 7 / 9)
ScaleStepDownKey=0x67
ScaleStepUpKey=0x69
; Move step down / up (0x6D / 0x6B = numpad - / +)
MoveStepDownKey=0x6D
MoveStepUpKey=0x6B
; Rotate step down / up (0x6F / 0x6A = numpad / / *)
RotateStepDownKey=0x6F
RotateStepUpKey=0x6A
; Reset rotation (0x60 = numpad 0): undo every turn No More Red made to the object since the game started.
; Reset scale (0x6E = numpad .): back to 100%.
ResetRotationKey=0x60
ResetScaleKey=0x6E
; Cycle the rotate axis for placed objects: the object's own Z (turn) / X / Y (a structure: its root's).
; 0x10D = numpad Enter (the main Enter key is 0x0D).
RotateAxisKey=0x10D

[Relax]
; 1 = unrestricted, 0 = vanilla restriction
Floating=1
Intersecting=1
TerrainOnly=1
InWater=1
NotInWater=1
NavmeshOnly=1
Unsupported=1
UnsupportedWall=1
UnsupportedCeiling=1
RadiusOverlap=1
TooCloseToPlayer=1
FoundationTooTall=1
OnAnimatedDoor=1
InvalidSurface=1

; Build on POI locations / cities
RestrictedArea=1

; "Must be snapped to an existing piece" (walls etc.)
NoSnapping=1
NoSnappingFloor=1

; Place extractors off a resource vein (they will generate resources regardless of a vein)
NotOnResourceVein=1

; Cheats
MissingComponents=0
MissingAttributes=0
ExceededBudget=0
ExceededMaxCount=0



;#### Risky/Untested Settings
;These never really have a use case unless you are doing something specific

; Allows you to place two workshops on top of each other
OverlapsOtherWorkshop=0

; Allows you to place workshops outside the map boundary edge
OutsidePlayableArea=0


[Advanced]
; Offset of the placement status byte. 0 = read it from the game's code (recommended; 0x193 in 1.16.244)
StatusOffset=0
